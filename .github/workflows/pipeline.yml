name: Tourism MLOps CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tourism_project/deployment/*.joblib'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-main
  cancel-in-progress: true

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tourism_project/requirements.txt
      - run: python tourism_project/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tourism_project/requirements.txt
      - run: python tourism_project/model_building/prep.py
      - uses: actions/upload-artifact@v4
        with:
          name: tourism-data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tourism_project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: tourism-data-splits

      # Updated MLflow configuration
      - name: Train Tourism Model
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python tourism_project/model_building/train.py

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-tracking
          path: |
            mlruns/
            cv_results.csv
          if-no-files-found: error

      - name: Commit trained model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tourism_project/deployment/tourism_purchase_model.joblib
          git diff --cached --quiet || (git commit -m 'Update tourism model [skip ci]' && git push origin HEAD:main)
